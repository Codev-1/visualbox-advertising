<!DOCTYPE html>

<head>

    <style>
        :root {
            --brand-emerald: #165848;
            --brand-emerald-light: #1cb08e;
            --brand-gold: #f6c42f;
            --ui-dark: #0f172a;
            --ui-slate: #475569;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f9f8de; /* Swapped background to your premium signature warm ivory tone */
            margin: 0;
            padding: 0;
        }
        
        .font-outfit { font-family: 'Outfit', sans-serif; }

        .text-gradient {
            background: linear-gradient(135deg, var(--brand-emerald) 0%, var(--brand-emerald-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==========================================================================
           2. RE-ENGINEERED EDGE-TO-EDGE PREMIUM GALLERY LOOK
           ========================================================================== */
        
        /* Premium Structural Cards with Depth Modifiers */
        .portfolio-card {
            position: relative;
            width: 106%;
            aspect-ratio: 6 / 5; /* Made cards clean geometric squares to showcase graphics perfectly */
            border-radius: 0px;
            overflow: hidden;
            background-color: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.02);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Adjusted Image Properties to match edge-to-edge requirements safely */
        .portfolio-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Edge-to-edge layout filling for custom print/branding artwork */
            transform: scale(1.01);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
        }

        /* ==========================================================================
           3. INTERACTIVE HOVER SLIDE-UP OVERLAYS
           ========================================================================== */
        .portfolio-overlay {
            background: linear-gradient(to top, rgba(15, 23, 42, 0) 0%, transparent 100%);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 0);
        }

        .portfolio-text {
            transform: translateY(25px);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        /* Hover Transformation Lifts */
        .portfolio-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.02);
            border-color: rgba(22, 88, 72, 0.2);
        }

        .portfolio-card:hover img {
            transform: scale(1.05); /* Smooth modern zoom on graphic focal nodes */
        }

        .portfolio-card:hover .portfolio-overlay {
            background: linear-gradient(
                to top, 
                rgba(15, 23, 42, 0.95) 0%, 
                rgba(15, 23, 42, 0.1) 65%, 
                transparent 100%
            );
        }

        .portfolio-card:hover .portfolio-text {
            transform: translateY(0);
            opacity: 1;
        }

        /* Modernized Interactive Filter Tabs Grid Buttons */
        .filter-btn {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.65rem 1.75rem;
            border-radius: 50px; /* Capsule rounding style */
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            color: var(--ui-slate);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .filter-btn:hover {
            border-color: var(--brand-emerald);
            color: var(--brand-emerald);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 88, 72, 0.05);
        }

        .filter-btn.active {
            background-color: var(--brand-emerald);
            border-color: var(--brand-emerald);
            color: #ffffff;
            box-shadow: 0 12px 20px -6px rgba(22, 88, 72, 0.25);
        }

        @keyframes itemFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-item-fade {
            animation: itemFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
    </style>
    
    <link rel="stylesheet" href="css/footer.css">
</head>
<body class="antialiased min-h-screen relative overflow-x-hidden">

    <div id="navbar-placeholder"></div>

    <main class="relative z-10 min-h-screen">
        
        <!-- Premium Section Hero Block -->
        <section class="portfolio-hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <span class="hero-badge">Creative Portfolio Showcase</span>
                <h1>Our Creative <span>Masterpieces</span></h1>
                <p>
                    Explore our collection of custom packaging, premium corrugated boxes,
                    luxury branding systems, paper bags, printing solutions and retail packaging.
                </p>
                <div class="hero-stats">
                    <div class="stat"><h3>500+</h3><span>Projects</span></div>
                    <div class="stat"><h3>100+</h3><span>Clients</span></div>
                    <div class="stat"><h3>10+</h3><span>Industries</span></div>
                </div>
            </div>
        </section>

        <style>
            .portfolio-hero {
                position: relative;
                min-height: 55vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 140px 20px 80px;
                background: url('assests/images/Sweets-Packaging.png');
                background-size: cover;
                background-position: center;
                overflow: hidden;
            }
            .hero-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(135deg, rgba(15, 23, 42, 0.15), rgba(22, 88, 72, 0.15));
            }
            .hero-content { position: relative; z-index: 2; max-width: 900px; }
            .hero-badge {
                display: inline-block;
                padding: 10px 20px;
                background: rgba(255, 255, 255, .12);
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255,255,255,.18);
                border-radius: 60px;
                color: #fff;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
                margin-bottom: 24px;
            }
            .hero-content h1 { font-size: clamp(36px, 6vw, 66px); font-weight: 800; line-height: 1.1; color: #fff; margin-bottom: 20px; text-transform: uppercase; }
            .hero-content h1 span {/* 85% opacity gradient shifting down smoothly to fully transparent */
background: linear-gradient(180deg, rgba(178, 15, 96, 0.85) 0%, rgb(177, 30, 163) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            .hero-content p { max-width: 700px; margin: auto; color: rgba(255,255,255,0.8); font-size: 18px; line-height: 1.7; }
            .hero-stats { margin-top: 40px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
            .stat { min-width: 140px; padding: 16px; border-radius: 16px; background: rgba(255, 255, 255, .1); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.12); }
            .stat h3 { color: #fff; font-size: 28px; font-weight: 800; margin-bottom: 4px; }
            .stat span { color: rgba(255,255,255,.7); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        </style>

        <!-- Filter Controls Navigation Section -->
        <section class="px-6 lg:px-12 max-w-[95rem] mx-auto mt-16 mb-12 relative z-20">
            <div class="flex flex-wrap justify-center gap-3" id="filters-container">
                <button class="filter-btn active" data-filter="all">All Items</button>
                <button class="filter-btn" data-filter="packaging">Packaging</button>
                <button class="filter-btn" data-filter="corrugated">Corrugated</button>
                <button class="filter-btn" data-filter="paperbags">Paper Bags</button>
                <button class="filter-btn" data-filter="branding">Branding</button>
                <button class="filter-btn" data-filter="printing">Printing</button>
            </div>
        </section>

        <!-- Main Cards Target Box Wrapper Layout -->
        <section class="px-6 lg:px-12 max-w-[95rem] mx-auto pb-32">
            <!-- FIXED: Shifted grid target configuration from lg:grid-cols-3 to lg:grid-cols-4 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8" id="portfolio-grid">
                <!-- Data injection script matrix location -->
            </div>
        </section>

    </main>

    <!-- Javascript Logical Execution Blocks -->
    <script>
        const portfolioData = [
            /* =====================
               PACKAGING
            ===================== */
            { category:"packaging", image:"assests/images/portfolio/Agarbatti Box 1.jpg", title:"Agarbatti Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Agarbatti Box 2.jpg", title:"Agarbatti Box" },
            { category:"packaging", image:"assests/images/portfolio/Burger Box 1.jpg", title:"Burger Box" },
            { category:"packaging", image:"assests/images/portfolio/Burger Box 2.jpg", title:"Burger Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Burger Box 3.jpg", title:"Custom Burger Box" },
            { category:"packaging", image:"assests/images/portfolio/Burger Box 4.jpg", title:"Food Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Cake Boxes.jpg", title:"Cake Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Cake Boxes 2.jpg", title:"Cake Box Design" },
            { category:"packaging", image:"assests/images/portfolio/Chocolate Box.jpg", title:"Chocolate Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Cookies Box.jpg", title:"Cookies Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Dryfruit Box.jpg", title:"Dry Fruit Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Game Box Rigid.jpg", title:"Game Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Lipstic Box.jpg", title:"Cosmetic Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Masale Box.jpg", title:"Masala Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Misal Box.jpg", title:"Misal Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Oil box.tif", title:"Oil Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Pastry Boxes.jpg", title:"Pastry Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Perfume Box 1.jpg", title:"Perfume Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Pharma Box.jpg", title:"Pharma Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Pizza Box 1.jpg", title:"Pizza Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Rigid Box 1.jpg", title:"Rigid Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Roll Boxe.jpg", title:"Roll Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Sandwitch Box 1.jpg", title:"Sandwich Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Sanitary Pad Box.jpg", title:"Sanitary Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Soap Box 1.jpg", title:"Soap Packaging" },
            { category:"packaging", image:"assests/images/portfolio/Tea Box.jpg", title:"Tea Packaging" },
            
            /* =====================
               CORRUGATED
            ===================== */
            { category:"corrugated", image:"assests/images/portfolio/Corrugated Box 1.jpg", title:"Corrugated Box" },
            { category:"corrugated", image:"assests/images/portfolio/Corrugated Box 2.jpg", title:"Shipping Box" },
            { category:"corrugated", image:"assests/images/portfolio/Corrugated Box 3.jpg", title:"Export Packaging" },
            { category:"corrugated", image:"assests/images/portfolio/Agri Product 3 Corrugated.jpg", title:"Agriculture Packaging" },
            
            /* =====================
               PAPER BAGS
            ===================== */
            { category:"paperbags", image:"assests/images/portfolio/Paper Bag.jpg", title:"Paper Bag" },
            { category:"paperbags", image:"assests/images/portfolio/Paper Bag 1.jpg", title:"Shopping Bag" },
            { category:"paperbags", image:"assests/images/portfolio/Paper Bag 2.jpg", title:"Retail Paper Bag" },
            { category:"paperbags", image:"assests/images/portfolio/Paper Bag 3.jpg", title:"Custom Paper Bag" },
            { category:"paperbags", image:"assests/images/portfolio/Paper Bag 4.jpg", title:"Luxury Paper Bag" },
            
            /* =====================
               BRANDING
            ===================== */
            { category:"branding", image:"assests/images/portfolio/Display Image 3.jpg", title:"Brand Identity" },
            { category:"branding", image:"assests/images/portfolio/Display Image 4.jpg", title:"Brand Packaging" },
            { category:"branding", image:"assests/images/portfolio/Display Image 5.jpg", title:"Retail Branding" },
            { category:"branding", image:"assests/images/portfolio/Display Image 6.jpg", title:"Luxury Branding" },
            { category:"branding", image:"assests/images/portfolio/Display Image 7.jpg", title:"Brand Collection" },
            
            /* =====================
               PRINTING
            ===================== */
            { category:"printing", image:"assests/images/portfolio/Display Image 2.jpg", title:"Label Printing" },
            { category:"printing", image:"assests/images/portfolio/Display Image 8.jpg", title:"Print Production" },
            { category:"printing", image:"assests/images/portfolio/Accessories Box.jpg", title:"Custom Printing" },
            { category:"printing", image:"assests/images/portfolio/Chocolate Box 2.jpg", title:"Offset Printing" }
        ];

        const portfolioGrid = document.getElementById("portfolio-grid");

        function renderPortfolio(filter = "all") {
            portfolioGrid.innerHTML = "";

            const items = portfolioData.filter(item => {
                return filter === "all" ? true : item.category === filter;
            });

            if (items.length === 0) {
                portfolioGrid.innerHTML = `
                    <div class="col-span-full py-24 text-center text-slate-400 font-outfit text-lg">
                        No portfolio assets match this category right now.
                    </div>`;
                return;
            }

            items.forEach((item, index) => {
                let displayBadge = item.category === 'paperbags' ? 'Paper Bag' : item.category;

                const cardHTML = `
                    <div class="group portfolio-card animate-item-fade" style="animation-delay: ${index * 25}ms">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        
                        <div class="absolute inset-0 portfolio-overlay flex flex-col justify-end p-6">
                            <div class="portfolio-text w-full">
                                <span class="inline-block px-2.5 py-0.5 bg-[#f6c42f] text-[#0f172a] font-bold text-[10px] uppercase tracking-widest rounded mb-2 font-outfit">
                                    ${displayBadge}
                                </span>
                                <h3 class="font-outfit text-lg font-bold text-white tracking-wide uppercase leading-tight">
                                    ${item.title}
                                </h3>
                                <p class="text-slate-300 font-outfit text-[11px] font-light tracking-wide mt-1 opacity-90">
                                    Premium custom solution engineered by VisualBox.
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                portfolioGrid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        renderPortfolio();

        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderPortfolio(btn.dataset.filter);
            });
        });
    </script>

    <section class="vb-cta-section">
        <!-- CTA Content Elements -->
    </section>
